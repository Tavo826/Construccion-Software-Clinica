<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-container">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
      </div>
      <h1 class="login-title">Sistema de Gestión Clínica</h1>
      <p class="login-subtitle">Ingrese sus credenciales para acceder</p>
    </div>

    @if (!isLoading) {
    <form (ngSubmit)="logIn()" class="login-form" [formGroup]="form">
      <div class="form-group">
        <label for="username" class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Usuario
        </label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input"
          placeholder="Ingrese su usuario"
          formControlName="username"
        >
        <div *ngIf="form.controls.username.errors && isSubmitted"
          class="alert alert-danger validationError mt-2">
          <div [hidden]="!form.controls.username.errors['required']">
              El usuario es requerido
          </div>
          <div [hidden]="!form.controls.username.errors['minlength']">
              El usuario debe tener mínimo 6 caracteres
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Contraseña
        </label>
        <div class="password-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            class="form-input"
            placeholder="Ingrese su contraseña"
            formControlName="password"
          >
          <button type="button" class="toggle-password" (click)="togglePassword()" aria-label="Mostrar contraseña">
            @if (!showPassword) {
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
        <div *ngIf="form.controls.password.errors && isSubmitted"
          class="alert alert-danger validationError mt-2">
          <div [hidden]="!form.controls.password.errors['required']">
              La contraseña es requerida
          </div>
          <div [hidden]="!form.controls.password.errors['minlength']">
              La contraseña debe tener mínimo 6 caracteres
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span class="btn-text">Iniciar Sesión</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </form>
    } @else {
        <app-loading></app-loading>
    }

    <div class="login-footer">
      <p class="footer-text">¿Problemas para acceder? Contacte a Recursos Humanos</p>
    </div>
  </div>

  <div class="background-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>
</div>

<app-error
  [show]="showErrorModal" 
  [title]="errorTitle"
  [message]="errorMessage" 
  (close)="closeErrorModal()">
</app-error>
